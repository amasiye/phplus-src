name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.4'
          - '8.5'

    env:
      COMPOSER_CACHE_DIR: /tmp/phplus-composer-cache
      COMPOSER_NO_INTERACTION: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2.10.3@sha256:7a2d379d5b8ffdaa028580ef26494c36d2feef4b178d3dd1473a4dbc5e17c8d6

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}

      - name: Validate Composer files
        run: composer validate --strict

      - name: Install locked dependencies
        run: composer install --prefer-dist --no-progress --no-ansi

      - name: Audit locked dependencies
        if: matrix.php == '8.4'
        run: composer audit --locked --abandoned=fail

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Smoke test CLI
        run: |
          php bin/phplus --version
          php bin/phplus --help

      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
